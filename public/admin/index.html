<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Gestor de Contenido - Simposio</title>
</head>
<body>
  <script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>
  <script src="https://unpkg.com/decap-cms@^3.0.0/dist/decap-cms.js"></script>
  <script>
    // Redirigir a /admin/ tras el login desde el widget de Identity.
    if (window.netlifyIdentity) {
      window.netlifyIdentity.on('init', function (user) {
        if (!user) {
          window.netlifyIdentity.on('login', function () {
            document.location.href = '/admin/';
          });
        }
      });
    }
  </script>
  <script>
    /* ===== Vistas previas con el estilo del sitio (equivalente a "Vista previa" de WordPress) ===== */
    (function () {
      if (!window.CMS) return;

      var previewCss = [
        ':root { --ugr-green: #2f680c; --ugr-green-dark: #1f4a08; --ugr-green-light: #4d8a22; --ugr-text: #333; --ugr-text-light: #666; --ugr-cream: #faf7f0; }',
        'body { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; margin: 0; background: #fff; color: var(--ugr-text); }',
        '.pv-hero { background: var(--ugr-green); padding: 2.5rem 1rem; text-align: center; }',
        '.pv-hero h1 { color: #fff; font-size: 1.8rem; margin: 0; line-height: 1.25; }',
        '.pv-hero .pv-meta { color: rgba(255,255,255,0.8); font-size: 0.85rem; margin-top: 0.6rem; }',
        '.pv-hero .pv-kicker { color: rgba(255,255,255,0.7); font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.15em; margin-bottom: 0.5rem; }',
        '.pv-body { max-width: 46rem; margin: 0 auto; padding: 2rem 1.25rem; }',
        '.pv-image { width: 100%; border-radius: 0.75rem; box-shadow: 0 10px 25px rgba(0,0,0,0.15); margin-bottom: 1.5rem; }',
        '.pv-pills { display: flex; flex-wrap: wrap; gap: 0.5rem; margin-bottom: 1.25rem; }',
        '.pv-pill-cat { font-size: 0.7rem; text-transform: uppercase; letter-spacing: 0.08em; font-weight: 600; background: rgba(47,104,12,0.1); color: var(--ugr-green); padding: 0.25rem 0.75rem; border-radius: 999px; }',
        '.pv-pill-tag { font-size: 0.7rem; text-transform: uppercase; letter-spacing: 0.08em; font-weight: 600; background: #f3f4f6; color: var(--ugr-text-light); padding: 0.25rem 0.75rem; border-radius: 999px; }',
        '.pv-excerpt { font-size: 1.1rem; line-height: 1.6; font-weight: 500; border-left: 4px solid var(--ugr-green); padding-left: 1rem; margin-bottom: 1.5rem; color: var(--ugr-text); }',
        '.pv-content { font-size: 1rem; line-height: 1.75; }',
        '.pv-content h1, .pv-content h2, .pv-content h3 { color: var(--ugr-green-dark); }',
        '.pv-content a { color: var(--ugr-green); }',
        '.pv-content blockquote { border-left: 3px solid var(--ugr-green-light); margin-left: 0; padding-left: 1rem; color: var(--ugr-text-light); }',
        '.pv-content img { max-width: 100%; border-radius: 0.5rem; }',
        '.pv-draft-banner { background: #fffbeb; border: 1px solid #f59e0b; color: #92400e; font-size: 0.8rem; font-weight: 600; padding: 0.5rem 1rem; border-radius: 0.5rem; margin-bottom: 1.25rem; text-align: center; }',
        '.pv-project-meta { display: flex; flex-wrap: wrap; gap: 1rem; font-size: 0.85rem; color: var(--ugr-text-light); margin-bottom: 1.25rem; }',
        '.pv-project-meta strong { color: var(--ugr-green); font-weight: 600; }'
      ].join('\n');

      CMS.registerPreviewStyle(previewCss, { raw: true });

      var h = window.h;
      var createClass = window.createClass;

      function pills(entry) {
        var cats = entry.getIn(['data', 'categories']);
        var tags = entry.getIn(['data', 'tags']);
        var items = [];
        if (cats && cats.forEach) {
          cats.forEach(function (c) { items.push(h('span', { className: 'pv-pill-cat', key: 'c-' + c }, c)); });
        }
        if (tags && tags.forEach) {
          tags.forEach(function (t) { items.push(h('span', { className: 'pv-pill-tag', key: 't-' + t }, '#' + t)); });
        }
        if (items.length === 0) return null;
        return h('div', { className: 'pv-pills' }, items);
      }

      function draftBanner(entry) {
        if (entry.getIn(['data', 'draft'])) {
          return h('div', { className: 'pv-draft-banner' }, 'BORRADOR — esta entrada no aparecerá en el sitio público');
        }
        return null;
      }

      function formatDateEs(dateStr) {
        if (!dateStr) return '';
        var d = new Date(dateStr);
        if (isNaN(d.getTime())) return String(dateStr);
        return d.toLocaleDateString('es-ES', { day: 'numeric', month: 'long', year: 'numeric' });
      }

      var EntradaPreview = createClass({
        render: function () {
          var entry = this.props.entry;
          var title = entry.getIn(['data', 'title']) || 'Sin título';
          var date = entry.getIn(['data', 'date']);
          var author = entry.getIn(['data', 'author']);
          var description = entry.getIn(['data', 'description']);
          var image = this.props.getAsset(entry.getIn(['data', 'image']));
          var meta = [formatDateEs(date), author].filter(Boolean).join(' · ');

          return h('div', {},
            h('div', { className: 'pv-hero' },
              h('div', { className: 'pv-kicker' }, 'Entrada'),
              h('h1', {}, title),
              meta ? h('div', { className: 'pv-meta' }, meta) : null
            ),
            h('div', { className: 'pv-body' },
              draftBanner(entry),
              image && image.toString() ? h('img', { className: 'pv-image', src: image.toString() }) : null,
              pills(entry),
              description ? h('p', { className: 'pv-excerpt' }, description) : null,
              h('div', { className: 'pv-content' }, this.props.widgetFor('body'))
            )
          );
        }
      });

      var MemoriaPreview = createClass({
        render: function () {
          var entry = this.props.entry;
          var number = entry.getIn(['data', 'number']);
          var title = entry.getIn(['data', 'title']) || 'Sin título';
          var place = entry.getIn(['data', 'place']);
          var author = entry.getIn(['data', 'author']);
          var collective = entry.getIn(['data', 'collective']);
          var description = entry.getIn(['data', 'description']);
          var image = this.props.getAsset(entry.getIn(['data', 'image']));

          var metaItems = [];
          if (place) metaItems.push(h('span', { key: 'place' }, h('strong', {}, 'Lugar: '), place));
          if (author) metaItems.push(h('span', { key: 'author' }, h('strong', {}, 'Autor/a: '), author));
          if (collective) metaItems.push(h('span', { key: 'col' }, h('strong', {}, 'Colectivo: '), collective));

          return h('div', {},
            h('div', { className: 'pv-hero' },
              h('div', { className: 'pv-kicker' }, 'Museo de Memorias Vivas'),
              h('h1', {}, (number ? number + '. ' : '') + title)
            ),
            h('div', { className: 'pv-body' },
              draftBanner(entry),
              image && image.toString() ? h('img', { className: 'pv-image', src: image.toString() }) : null,
              metaItems.length ? h('div', { className: 'pv-project-meta' }, metaItems) : null,
              pills(entry),
              description ? h('p', { className: 'pv-excerpt' }, description) : null,
              h('div', { className: 'pv-content' }, this.props.widgetFor('body'))
            )
          );
        }
      });

      CMS.registerPreviewTemplate('entradas', EntradaPreview);
      CMS.registerPreviewTemplate('memorias', MemoriaPreview);
      // Las colecciones de borradores comparten carpeta y campos, así que
      // usan las mismas vistas previas que sus colecciones publicadas.
      CMS.registerPreviewTemplate('borradores-entradas', EntradaPreview);
      CMS.registerPreviewTemplate('borradores-memorias', MemoriaPreview);

      /* ===== Guardar como borrador (hook oficial de Decap) =====
       * El estado se encapsula en window.__cmsDraftState con un ID de
       * transacción único para evitar race conditions si el usuario pulsa
       * varias veces o alterna entre "Guardar como borrador" y "Publish".
       * El hook preSave también rellena la fecha automáticamente si el campo
       * date existe y está vacío (como hace WordPress). */
      window.__cmsDraftState = {
        active: false,
        transactionId: null,
        timestamp: 0,
        collection: null,
        slug: null,
      };

      function generateId() {
        return Math.random().toString(36).slice(2) + Date.now().toString(36);
      }

      function pad2(n) {
        return n < 10 ? '0' + n : '' + n;
      }

      function todayIso() {
        var d = new Date();
        return d.getFullYear() + '-' + pad2(d.getMonth() + 1) + '-' + pad2(d.getDate());
      }

      function setDraftState(active, meta) {
        if (active) {
          window.__cmsDraftState = {
            active: true,
            transactionId: (meta && meta.transactionId) || generateId(),
            timestamp: Date.now(),
            collection: (meta && meta.collection) || null,
            slug: (meta && meta.slug) || null,
          };
        } else {
          window.__cmsDraftState = {
            active: false,
            transactionId: null,
            timestamp: 0,
            collection: null,
            slug: null,
          };
        }
      }
      window.setDraftState = setDraftState;

      function isDraftSaveActive() {
        return window.__cmsDraftState && window.__cmsDraftState.active === true;
      }
      window.isDraftSaveActive = isDraftSaveActive;

      // Colecciones que solo pueden editar los administradores.
      var ADMIN_ONLY_COLLECTIONS = ['simposios', 'categorias', 'etiquetas', 'paginas', 'borradores-paginas'];

      function currentUserHasRole(role) {
        var identity = window.netlifyIdentity;
        var user = identity && identity.currentUser ? identity.currentUser() : null;
        if (!user) return false;
        var metadata = user.app_metadata || user.user_metadata || {};
        var roles = metadata.roles || user.roles || [];
        return roles.indexOf(role) !== -1;
      }

      CMS.registerEventListener({
        name: 'preSave',
        handler: function (event) {
          var collection = event.entry.get('collection');
          if (!currentUserHasRole('admin') && ADMIN_ONLY_COLLECTIONS.indexOf(collection) !== -1) {
            throw new Error('Solo los administradores pueden editar la colección "' + collection + '".');
          }

          try {
            var data = event.entry.get('data');
            var active = isDraftSaveActive();

            // Fecha automática: si el campo existe y está vacío, rellenar con hoy.
            try {
              if (data.has('date')) {
                var dateVal = data.get('date');
                if (dateVal === undefined || dateVal === null || dateVal === '') {
                  data = data.set('date', todayIso());
                }
              }
            } catch (dateErr) {
              // Colección sin campo date: ignorar silenciosamente.
            }

            // El campo draft es oculto y se gestiona automáticamente:
            //  - "Guardar como borrador" → draft: true
            //  - "Publish" (guardado normal) → draft: false (publica, incluso
            //    si la entrada era un borrador)
            data = data.set('draft', active);
            return data;
          } catch (e) {
            console.error('[CMS Draft] preSave error:', e);
            throw e;
          }
        },
      });

      CMS.registerEventListener({
        name: 'postSave',
        handler: function (event) {
          var details = null;
          var isDraft = false;
          var state = window.__cmsDraftState || {};
          try {
            var entry = event.entry;
            details = {
              slug: entry.get('slug') || '',
              collection: entry.get('collection') || '',
              title: entry.getIn(['data', 'title']) || '',
            };
            isDraft = entry.getIn(['data', 'draft']) === true;
          } catch (e) {}

          // Si el guardado se inició como "Guardar como borrador", notificar y
          // limpiar el estado SIEMPRE para que no se quede pillado.
          if (state.active) {
            if (isDraft && typeof window.__cmsOnDraftSaved === 'function') {
              window.__cmsOnDraftSaved(details);
            }
            setDraftState(false);
          }

          // Si se guardó como publicado, quitar de borradores recientes.
          if (details && !isDraft) {
            if (typeof window.__cmsOnEntryPublished === 'function') {
              window.__cmsOnEntryPublished(details);
            }
          }
        },
      });

      CMS.registerEventListener({
        name: 'prePublish',
        handler: function (event) {
          if (isDraftSaveActive()) return;

          if (!currentUserHasRole('admin')) {
            throw new Error('Solo los administradores pueden publicar. Los editores pueden guardar borradores o revisiones.');
          }
        },
      });

    })();
  </script>
  <style>
    :root {
      --wp-admin-bar-height: 52px;
      --bg: #f0f0f1;
      --surface: #ffffff;
      --surface-alt: #f9fafb;
      --text: #111827;
      --muted: #6b7280;
      --border: #e5e7eb;
      --border-strong: #c3c4c7;
      --primary: #2271b1;
      --primary-hover: #135e96;
      --primary-contrast: #ffffff;
      --sidebar-bg: #1d2327;
      --sidebar-text: #c3c4c7;
      --sidebar-heading: #f0f0f1;
      --sidebar-hover: #2c3338;
      --sidebar-active-bg: #2271b1;
      --sidebar-active-text: #ffffff;
      --input-bg: #ffffff;

      --input-bg: #ffffff;
      --input-border: #d1d5db;

      --overlay-bg: rgba(17,24,39,0.15);
      --toast-bg: #111827;
      --toast-text: #f8fafc;
    }

    /* =====================================================
       WordPress Admin Style Overhaul - Full Dark Theme
       ===================================================== */

    /* --- Ocultar la barra por defecto de Decap CMS --- */
    body > header,
    header[class] {
      display: none !important;
    }

    /* --- Ocultar el avatar/menú de usuario nativo de Decap:
       el usuario ya se muestra en la barra superior personalizada --- */
    [class*="AvatarDropdownButton"] {
      display: none !important;
    }
    html {
      scroll-padding-top: 32px !important;
    }

    /* --- Admin Bar (top bar estilo WordPress) --- */
    #wp-admin-bar {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      height: var(--wp-admin-bar-height);
      background: var(--sidebar-bg) !important;
      color: var(--sidebar-text) !important;
      z-index: 999999;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 18px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      box-shadow: 0 1px 4px rgba(0,0,0,0.22);
    }
    #wp-admin-bar .wp-bar-left {
      display: flex;
      align-items: center;
      gap: 16px;
    }
    #wp-admin-bar .wp-bar-right {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    #wp-admin-bar .site-name {
      color: inherit !important;
      font-size: 17px;
      font-weight: 600;
      text-decoration: none;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    #wp-admin-bar .site-name:hover { color: var(--sidebar-active-text) !important; }
    #wp-admin-bar .site-name svg { width: 22px; height: 22px; }
    #wp-admin-bar .bar-item {
      color: inherit !important;
      font-size: 15px;
      text-decoration: none;
      padding: 8px 14px;
      border-radius: 4px;
      display: flex;
      align-items: center;
      gap: 4px;
      transition: background 0.15s, color 0.15s;
    }
    #wp-admin-bar .bar-item:hover {
      background: var(--sidebar-hover) !important;
      color: var(--sidebar-active-text) !important;
    }
    #wp-admin-bar .bar-item svg { width: 19px; height: 19px; }
    #wp-admin-bar .bar-user {
      color: var(--primary) !important;
      font-size: 15px;
      font-weight: 500;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    #wp-admin-bar .bar-user .avatar-sm {
      width: 30px;
      height: 30px;
      border-radius: 50%;
      background: var(--primary) !important;
      color: var(--primary-contrast) !important;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 11px;
      font-weight: 700;
    }

    /* --- Body offset --- */
    body { margin-top: var(--wp-admin-bar-height) !important; }
    html { scroll-padding-top: var(--wp-admin-bar-height) !important; }

    /* --- Bajar el contenedor del editor de Decap (position:absolute; top:0; height:100%)
       para que la barra superior no tape la cabecera del editor --- */
    [class*="EditorContainer"] {
      top: var(--wp-admin-bar-height) !important;
      height: calc(100% - var(--wp-admin-bar-height)) !important;
    }

    /* =====================================================
       Sidebar - Fully Dark Theme
       ===================================================== */

    /* Main sidebar container */
    aside,
    nav[class*="sidebar" i],
    div[class*="sidebar" i],
    div[class*="Sidebar" i],
    div[class*="nav" i][class*="side" i] {
      background: #1d2327 !important;
      color: #c3c4c7 !important;
      border-right: 1px solid #2c3338 !important;
    }

    /* All text in sidebar */
    aside *, nav[class*="sidebar" i] *, div[class*="sidebar" i] * {
      color: inherit !important;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif !important;
    }

    /* Sidebar headings - white */
    aside h2, aside h3, aside h4,
    aside [class*="heading" i],
    nav[class*="sidebar" i] h2,
    nav[class*="sidebar" i] h3 {
      color: #f0f0f1 !important;
      font-size: 13px !important;
      font-weight: 700 !important;
      text-transform: uppercase !important;
      letter-spacing: 0.04em !important;
      padding: 12px 16px 6px !important;
      margin: 0 !important;
    }

    /* Group labels */
    .wp-menu-group-label {
      color: #8c8f94 !important;
      font-size: 11px !important;
      font-weight: 600 !important;
      text-transform: uppercase !important;
      letter-spacing: 0.06em !important;
      padding: 16px 16px 4px !important;
      display: block !important;
    }

    /* Sidebar links */
    aside a,
    nav[class*="sidebar" i] a,
    div[class*="sidebar" i] a {
      color: #c3c4c7 !important;
      font-size: 13px !important;
      font-weight: 400 !important;
      padding: 8px 16px !important;
      display: flex !important;
      align-items: center !important;
      gap: 10px !important;
      border-radius: 0 !important;
      transition: all 0.15s !important;
      text-decoration: none !important;
      border: none !important;
      opacity: 1 !important;
    }
    aside a span,
    nav[class*="sidebar" i] a span,
    div[class*="sidebar" i] a span {
      color: inherit !important;
      opacity: 1 !important;
    }
    aside a:hover,
    nav[class*="sidebar" i] a:hover,
    div[class*="sidebar" i] a:hover {
      background: #2c3338 !important;
      color: #72aee6 !important;
    }

    /* Active link */
    aside a[aria-current="page"],
    aside a.active,
    aside a[class*="active" i],
    nav[class*="sidebar" i] a[aria-current="page"] {
      background: #2271b1 !important;
      color: #fff !important;
    }

    /* Sidebar icons */
    aside svg,
    nav[class*="sidebar" i] svg,
    div[class*="sidebar" i] svg {
      width: 18px !important;
      height: 18px !important;
      flex-shrink: 0 !important;
      opacity: 0.8 !important;
    }

    /* =====================================================
       Sidebar nativo de Decap (clases ...-SidebarContainer):
       fondo blanco y texto oscuro para un look más profesional
       ===================================================== */
    [class*="SidebarContainer"] {
      background: #ffffff !important;
      color: #111827 !important;
      border: 1px solid #e5e7eb !important;
      padding-top: 14px !important;
    }
    [class*="SidebarContainer"] [class*="SidebarHeading"] {
      color: #111827 !important;
    }
    [class*="SidebarContainer"] [class*="SidebarNavLink"],
    [class*="SidebarContainer"] a {
      color: #111827 !important;
      border-left-color: transparent !important;
    }
    [class*="SidebarContainer"] [class*="SidebarNavLink"]:hover,
    [class*="SidebarContainer"] a:hover {
      background: #f3f4f6 !important;
      color: #111827 !important;
    }
    [class*="SidebarContainer"] svg {
      color: #6b7280 !important;
    }
    [class*="SidebarContainer"] input {
      background: #f9fafb !important;
      border: 1px solid #d1d5db !important;
      color: #111827 !important;
      margin-top: 10px !important;
    }
    [class*="SidebarContainer"] input::placeholder {
      color: #9ca3af !important;
    }

    /* Sidebar search input */
    aside input[type="search"],
    aside input[type="text"],
    nav[class*="sidebar" i] input {
      background: #2c3338 !important;
      border: 1px solid #3c434a !important;
      color: #c3c4c7 !important;
      border-radius: 4px !important;
      padding: 6px 10px !important;
      font-size: 13px !important;
      width: 100% !important;
      box-sizing: border-box !important;
    }
    aside input:focus,
    nav[class*="sidebar" i] input:focus {
      border-color: #2271b1 !important;
      box-shadow: 0 0 0 1px #2271b1 !important;
      outline: none !important;
    }
    aside input::placeholder,

      function waitForIdentity(callback) {
        if (window.netlifyIdentity) {
          callback(window.netlifyIdentity);
          return;
        }
        var attempts = 0;
        var maxAttempts = 100;
        var interval = setInterval(function () {
          attempts++;
          if (window.netlifyIdentity) {
            clearInterval(interval);
            log('netlifyIdentity encontrado después de ' + attempts + ' intentos');
            callback(window.netlifyIdentity);
          } else if (attempts >= maxAttempts) {
            clearInterval(interval);
            log('netlifyIdentity no se encontró tras esperar');
          }
        }, 100);
      }

      function getUserName(user) {
        if (!user) return null;
        var metadata = user.user_metadata || user.app_metadata || {};
        return metadata.full_name || metadata.name || user.email || 'Usuario';
      }

      function isAdmin(user) {
        if (!user) return false;
        var metadata = user.app_metadata || user.user_metadata || {};
        var roles = metadata.roles || user.roles || [];
        log('roles del usuario:', JSON.stringify(roles));
        return roles.indexOf('admin') !== -1;
      }

      function getAvatarContainer() {
        var selectors = [
          'header button img[src*="gravatar"]',
          'header button img[src^="data:"]',
          'header button img[alt*="avatar" i]',
          '[data-testid="user-menu"]',
          '[data-testid="avatar-menu"]',
          '[data-testid="user-button"]',
          '[data-testid="account-menu"]',
          '[aria-label*="user" i]',
          '[aria-label*="usuario" i]',
          '[aria-label*="account" i]',
          '[aria-label*="perfil" i]',
          '[aria-label*="profile" i]',
        ];
        for (var i = 0; i < selectors.length; i++) {
          var target = document.querySelector(selectors[i]);
          if (target) {
            var container = target.closest('button, [role="button"]');
            if (container) return { container: container };
          }
        }

        function isQuickAdd(el) {
          var label = (el.getAttribute('aria-label') || el.textContent || '').toLowerCase();
          if (/\b(add|new|create|quick)\b/.test(label)) return true;
          var svg = el.querySelector('svg');
          if (svg) {
            var paths = svg.querySelectorAll('path');
            for (var k = 0; k < paths.length; k++) {
              var d = (paths[k].getAttribute('d') || '').toLowerCase();
              // Flecha desplegable: path corto con líneas rectas (sin curvas bezier).
              if (d.length < 80 && d.indexOf('l') !== -1 && d.indexOf('c') === -1) return true;
            }
          }
          return false;
        }

        var all = Array.prototype.slice.call(document.querySelectorAll('body *'));

        // 1. Prioridad: elemento con imagen más a la derecha en la zona superior (gravatar/avatar).
        var withImg = all.filter(function (el) {
          var rect = el.getBoundingClientRect();
          if (rect.width <= 0 || rect.height <= 0 || rect.top >= 200) return false;
          var img = el.querySelector('img[src]');
          return !!img;
        });
        if (withImg.length > 0) {
          withImg.sort(function (a, b) {
            return b.getBoundingClientRect().right - a.getBoundingClientRect().right;
          });
          var target = withImg[0];
          var container = target.closest('button, [role="button"]') || target;
          if (!isQuickAdd(container)) {
            log('avatar detectado por imagen:', container.tagName, container.className);
            return { container: container };
          }
        }

        // 2. Elemento circular más a la derecha, excluyendo quick-add.
        var circular = all.filter(function (el) {
          var rect = el.getBoundingClientRect();
          if (rect.width <= 0 || rect.height <= 0 || rect.top >= 200) return false;
          var style = window.getComputedStyle(el);
          var borderRadius = parseFloat(style.borderRadius);
          var minDim = Math.min(rect.width, rect.height);
          var isCircle = borderRadius >= minDim / 2;
          var ratio = rect.width / rect.height;
          var isSquare = ratio > 0.8 && ratio < 1.25;
          var hasIcon = !!el.querySelector('img, svg, i');
          return (isCircle || isSquare) && rect.width > 20 && rect.width < 80 && hasIcon && !isQuickAdd(el);
        });

        if (circular.length > 0) {
          circular.sort(function (a, b) {
            return b.getBoundingClientRect().right - a.getBoundingClientRect().right;
          });
          var target = circular[0];
          var container = target.closest('button, [role="button"]') || target;
          log('avatar detectado por forma circular:', container.tagName, container.className);
          return { container: container };
        }

        // 3. Último botón en la zona superior derecha que no sea quick-add.
        var buttons = Array.prototype.slice.call(document.querySelectorAll('button, [role="button"]'));
        buttons = buttons.filter(function (b) {
          var rect = b.getBoundingClientRect();
          return rect.width > 0 && rect.height > 0 && rect.top < 200 && !isQuickAdd(b);
        });
        if (buttons.length > 0) {
          buttons.sort(function (a, b) {
            return b.getBoundingClientRect().right - a.getBoundingClientRect().right;
          });
          log('avatar detectado como último botón no-quick-add:', buttons[0].tagName, buttons[0].className);
          return { container: buttons[0] };
        }

        // 4. Fallback final: cualquier elemento interactivo más a la derecha en la zona superior.
        var interactive = Array.prototype.slice.call(document.querySelectorAll('button, [role="button"], a, [onclick], [tabindex]:not([tabindex="-1"])'));
        interactive = interactive.filter(function (el) {
          var rect = el.getBoundingClientRect();
          return rect.width > 0 && rect.height > 0 && rect.top < 200 && !isQuickAdd(el);
        });
        if (interactive.length > 0) {
          interactive.sort(function (a, b) {
            return b.getBoundingClientRect().right - a.getBoundingClientRect().right;
          });
          log('avatar detectado como último interactivo:', interactive[0].tagName, interactive[0].className);
          return { container: interactive[0] };
        }

        log('no se detectó avatar');
        return null;
      }

      function ensureFloatingUserName(user) {
        var name = getUserName(user);
        if (!name) return;
        if (document.querySelector('#wp-admin-bar')) {
          removeUserName();
          return;
        }

        var existingInline = document.querySelector('.cms-user-name-inline');
        var existingFloating = document.querySelector('.cms-user-name-floating');
        if (existingInline) {
          var text = existingInline.querySelector('.cms-user-name-text');
          if (text) text.textContent = name;
          existingInline.title = name;
          return;
        }
        if (existingFloating) {
          existingFloating.textContent = name;
          existingFloating.title = name;
          return;
        }

        var avatar = getAvatarContainer();
        if (avatar && avatar.container.parentElement) {
            removeUserName();
          wrapper.className = 'cms-user-name-inline';
          wrapper.title = name;

          var dot = document.createElement('span');
          dot.className = 'cms-user-name-dot';

          var text = document.createElement('span');
          text.className = 'cms-user-name-text';
          text.textContent = name;

          wrapper.appendChild(dot);
          wrapper.appendChild(text);
          avatar.container.parentElement.insertBefore(wrapper, avatar.container);

          // Ajustar posición vertical para alinear con el avatar
          requestAnimationFrame(function () {
            var avatarRect = avatar.container.getBoundingClientRect();
            var badgeRect = wrapper.getBoundingClientRect();
            var avatarCenterY = avatarRect.top + avatarRect.height / 2;
            var badgeCenterY = badgeRect.top + badgeRect.height / 2;
            var diff = avatarCenterY - badgeCenterY;
            if (Math.abs(diff) > 1) {
              wrapper.style.position = 'relative';
              wrapper.style.top = diff + 'px';
            }
          });

          log('badge inline añadido:', name);
          return true;
        }
        log('avatar no disponible, badge no insertado aún');
        return false;
      }

      var CMS_ADMIN_THEME_KEY = 'cms_admin_theme';

      function removeUserName() {
        var floating = document.querySelector('.cms-user-name-floating');
        if (floating) floating.remove();
        var inline = document.querySelector('.cms-user-name-inline');

      function getSavedTheme() {
        try {
          return localStorage.getItem(CMS_ADMIN_THEME_KEY);
        } catch (e) {
          return null;
        }
      }

      function setSavedTheme(theme) {
        try {
          localStorage.setItem(CMS_ADMIN_THEME_KEY, theme);
        } catch (e) {}
      }

      function updateThemeToggleButton(theme) {
        var btn = document.getElementById('cms-theme-toggle');
        if (!btn) return;
        var text = btn.querySelector('.theme-toggle-text');
        if (text) {
          text.textContent = theme === 'dark' ? 'Oscuro' : 'Claro';
        }
      }

      function applyTheme(theme) {
        theme = theme === 'dark' ? 'dark' : 'light';
        document.documentElement.classList.remove('theme-light', 'theme-dark');
        document.documentElement.classList.add('theme-' + theme);
        setSavedTheme(theme);
        updateThemeToggleButton(theme);
      }

      function getPreferredTheme() {
        if (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) {
          return 'dark';
        }
        return 'light';
      }

      function initTheme() {
        var saved = getSavedTheme();
        applyTheme(saved || getPreferredTheme());
      }

      function toggleTheme() {
        var current = document.documentElement.classList.contains('theme-dark') ? 'dark' : 'light';
        applyTheme(current === 'dark' ? 'light' : 'dark');
      }

      function findCollectionsHeading() {
        var headings = document.querySelectorAll('h1, h2, h3, h4, h5, h6, p, div, span, li, a');
        for (var i = 0; i < headings.length; i++) {
          var h = headings[i];
          var text = h.textContent ? h.textContent.trim().toLowerCase() : '';
          if ((text === 'collections' || text === 'colecciones') && h.children.length === 0) {
            return h;
          }
        }
        return null;
      }

      function findSidebar() {
        // Buscar el heading exacto "Collections" y subir hasta el panel lateral.
        var heading = findCollectionsHeading();
        if (heading) {
          var parent = heading.parentElement;
          while (parent && parent !== document.body) {
            var rect = parent.getBoundingClientRect();
            // Panel lateral: pegado a la izquierda, angosto y con algo de altura.
            if (rect.left < 100 && rect.width > 100 && rect.width < 450 && rect.height > 80) {
              log('sidebar encontrado mediante heading Collections');
              return parent;
            }
            parent = parent.parentElement;
          }
        }

        var selectors = [
          'aside',
          '[class*="sidebar" i]',
          '[class*="Sidebar" i]',
          '[class*="sidenav" i]',
          '[class*="Sidenav" i]',
        ];
        for (var i = 0; i < selectors.length; i++) {
          var el = document.querySelector(selectors[i]);
          if (el) {
            var rect = el.getBoundingClientRect();
            if (rect.left < 100 && rect.width > 100 && rect.width < 450 && rect.height > 80) return el;
          }
        }

        return null;
      }

      function bindActionClicks(container) {
        var links = container.querySelectorAll('[data-cms-admin-tab]');
        for (var i = 0; i < links.length; i++) {
          (function (link) {
            link.addEventListener('click', function (e) {

      /* ===== Panel de administración integrado en el CMS ===== */

      function getToken() {
        var u = window.netlifyIdentity && window.netlifyIdentity.currentUser && window.netlifyIdentity.currentUser();
        return (u && u.token && u.token.access_token) || null;
      }

      function escapeHtml(str) {
        var div = document.createElement('div');
        div.textContent = str || '';
        return div.innerHTML;
      }

      function closeAdminPanel() {
        var overlay = document.querySelector('.cms-admin-overlay');
        if (overlay) overlay.remove();
      }

      function openAdminPanel(tab) {
        closeAdminPanel();

        var overlay = document.createElement('div');
        overlay.className = 'cms-admin-overlay';
        overlay.innerHTML =
          '<div class="cms-admin-panel">' +
          '  <div class="cms-admin-header">' +
          '    <h2>Administración del sitio</h2>' +
          '    <button class="cms-admin-close" title="Cerrar">×</button>' +
          '  </div>' +
          '  <div class="cms-admin-tabs">' +
          '    <button class="cms-admin-tab" data-tab="colecciones">Colecciones</button>' +
          '    <button class="cms-admin-tab" data-tab="nueva">Nueva colección</button>' +
          '    <button class="cms-admin-tab" data-tab="usuarios">Usuarios y roles</button>' +
          '    <button class="cms-admin-tab" data-tab="revisiones">Revisiones</button>' +
          '  </div>' +
          '  <div class="cms-admin-body"></div>' +
          '</div>';

        overlay.addEventListener('click', function (e) {
          if (e.target === overlay) closeAdminPanel();
        });
        overlay.querySelector('.cms-admin-close').addEventListener('click', closeAdminPanel);

        var tabs = overlay.querySelectorAll('.cms-admin-tab');
        for (var i = 0; i < tabs.length; i++) {
          (function (btn) {
            btn.addEventListener('click', function () {
              renderAdminTab(overlay, btn.getAttribute('data-tab'));
            });
          })(tabs[i]);
        }

        document.body.appendChild(overlay);
        renderAdminTab(overlay, tab || 'colecciones');
      }

      function renderAdminTab(overlay, tab) {
        var tabs = overlay.querySelectorAll('.cms-admin-tab');
        for (var i = 0; i < tabs.length; i++) {
          tabs[i].classList.toggle('active', tabs[i].getAttribute('data-tab') === tab);
        }
        var body = overlay.querySelector('.cms-admin-body');
        if (tab === 'colecciones') renderColecciones(body);
        else if (tab === 'nueva') renderNuevaColeccion(body);
        else if (tab === 'usuarios') renderUsuarios(body);
        else if (tab === 'revisiones') renderRevisiones(body);
      }

      /* --- Tab: Colecciones --- */
      function renderColecciones(body) {
        body.innerHTML = '<h3>Colecciones activas</h3><p class="cms-admin-muted">Cargando...</p>';
        fetch('/admin/config.yml?_=' + Date.now())
          .then(function (res) { return res.text(); })
          .then(function (yaml) {
            var regex = /-\s+name:\s*"?([\w-]+)"?[\s\S]*?label:\s*"([^"]+)"/g;
            var items = [];
            var m;
            while ((m = regex.exec(yaml)) !== null) {
              items.push({ name: m[1], label: m[2] });
            }
            if (items.length === 0) {
              body.innerHTML = '<h3>Colecciones activas</h3><p class="cms-admin-muted">No se encontraron colecciones.</p>';
              return;
            }
            var html = '<h3>Colecciones activas</h3><div class="cms-admin-list">';
            items.forEach(function (c) {
              html += '<a data-collection="' + escapeHtml(c.name) + '">' + escapeHtml(c.label) + '<span>Abrir en el CMS</span></a>';
            });
            html += '</div>';
            body.innerHTML = html;
            var links = body.querySelectorAll('[data-collection]');
            for (var i = 0; i < links.length; i++) {
              (function (link) {
                link.addEventListener('click', function () {
                  window.location.hash = '#/collections/' + link.getAttribute('data-collection');
                  closeAdminPanel();
                });
              })(links[i]);
            }
          })
          .catch(function (err) {
            body.innerHTML = '<h3>Colecciones activas</h3><p class="cms-admin-status err">Error: ' + escapeHtml(err.message) + '</p>';
          });
      }

      /* --- Tab: Nueva colección --- */
      function renderNuevaColeccion(body) {
        body.innerHTML =
          '<h3>Crear nueva colección</h3>' +
          '<form class="cms-admin-form" id="cms-nueva-coleccion">' +
          '  <label for="cms-col-name">Nombre interno</label>' +
          '  <input id="cms-col-name" required placeholder="ponentes" />' +
          '  <p class="cms-admin-hint">Solo letras, números y guiones.</p>' +
          '  <label for="cms-col-label">Etiqueta visible</label>' +
          '  <input id="cms-col-label" required placeholder="Ponentes del simposio" />' +
          '  <label for="cms-col-folder">Carpeta</label>' +
          '  <div style="display:flex;align-items:center;border:1px solid #d1d5db;border-radius:0.375rem;overflow:hidden;">' +
          '    <span style="padding:0.55rem 0.75rem;background:#f3f4f6;color:#6b7280;font-size:0.8rem;font-family:monospace;white-space:nowrap;border-right:1px solid #d1d5db;">src/content/</span>' +
          '    <input id="cms-col-folder" required placeholder="ponentes" style="flex:1;border:none;padding:0.55rem 0.75rem;font-size:0.875rem;outline:none;" />' +
          '  </div>' +
          '  <p class="cms-admin-hint">Solo el nombre de la carpeta. Ejemplo: <code>ponentes</code></p>' +


          '  <div>' +
          '    <button type="submit" class="cms-admin-submit">Crear colección</button>' +
          '    <span class="cms-admin-status" id="cms-col-status"></span>' +
          '  </div>' +
          '</form>';

        var form = body.querySelector('#cms-nueva-coleccion');
        var status = body.querySelector('#cms-col-status');

        form.addEventListener('submit', function (e) {
          e.preventDefault();
          var token = getToken();
          if (!token) {
            status.textContent = 'No hay sesión activa.';
            status.className = 'cms-admin-status err';
            return;
          }
          status.textContent = 'Creando...';
          status.className = 'cms-admin-status';
          var btn = form.querySelector('.cms-admin-submit');
          btn.disabled = true;

          fetch('/.netlify/functions/create-coleccion', {
            method: 'POST',
            headers: {
              'Content-Type': 'application/json',
              'Authorization': 'Bearer ' + token,
            },
            body: JSON.stringify({
              name: body.querySelector('#cms-col-name').value.trim(),
              label: body.querySelector('#cms-col-label').value.trim(),
              folder: 'src/content/' + body.querySelector('#cms-col-folder').value.trim().replace(/^src\/content\/?/, ''),
              slug: '{{slug}}',
              fields: 'fields:\n  - { label: "Título", name: "title", widget: "string" }\n  - { label: "Fecha", name: "date", widget: "string", required: false }\n  - { label: "Imagen", name: "image", widget: "image", required: false }\n  - { label: "Descripción", name: "description", widget: "text", required: false }\n  - { label: "Contenido", name: "body", widget: "markdown", required: false }',
            }),
          })
            .then(function (res) { return res.json().then(function (data) { return { ok: res.ok, data: data }; }); })
            .then(function (r) {
              btn.disabled = false;
              if (r.ok) {
                status.textContent = 'Colección creada. El sitio se redesplegará en unos minutos.';
                status.className = 'cms-admin-status ok';
                form.reset();
              } else {
                status.textContent = r.data.error || 'Error al crear la colección.';
                status.className = 'cms-admin-status err';
              }
            })
            .catch(function (err) {
              btn.disabled = false;
              status.textContent = 'Error de red: ' + err.message;
              status.className = 'cms-admin-status err';
            });
        });
      }

      /* --- Tab: Usuarios y roles --- */
      function renderUsuarios(body) {
        body.innerHTML = '<h3>Usuarios registrados</h3><p class="cms-admin-muted">Cargando usuarios...</p>';
        var token = getToken();
        if (!token) {
          body.innerHTML = '<h3>Usuarios registrados</h3><p class="cms-admin-status err">No hay sesión activa.</p>';
          return;
        }

        fetch('/.netlify/functions/manage-users', {
          headers: { 'Authorization': 'Bearer ' + token },
        })
          .then(function (res) { return res.json().then(function (data) { return { ok: res.ok, data: data }; }); })
          .then(function (r) {
            if (!r.ok) {
              body.innerHTML = '<h3>Usuarios registrados</h3><p class="cms-admin-status err">' + escapeHtml(r.data.error || 'Error al cargar usuarios.') + '</p>';
              return;
            }
            // Aviso en entorno local
            if (r.data._dev_notice) {
              body.innerHTML = '<h3>Usuarios registrados</h3>' +
                '<div style="background:#fffbeb;border:1px solid #fcd34d;border-radius:0.5rem;padding:1rem;color:#92400e;font-size:0.85rem;">' +
                '<strong>⚠ Entorno local</strong><br>' + escapeHtml(r.data._dev_notice) +
                '</div>';
              return;
            }
            var users = r.data.users || [];
            var html = '<h3>Usuarios registrados</h3>' +
              '<table class="cms-admin-table"><thead><tr><th>Usuario</th><th>Roles</th><th>Acciones</th></tr></thead><tbody>';
            users.forEach(function (u, idx) {
              var rolesHtml = u.roles.length
                ? u.roles.map(function (role) { return '<span class="cms-admin-role ' + escapeHtml(role) + '">' + escapeHtml(role) + '</span>'; }).join('')
                : '<span class="cms-admin-role none">sin rol</span>';
              html += '<tr>' +
                '<td><strong>' + escapeHtml(u.name || u.email) + '</strong><br /><span class="cms-admin-muted">' + escapeHtml(u.email) + '</span></td>' +
                '<td>' + rolesHtml + '</td>' +
                '<td>' +
                '<button class="cms-admin-rolebtn' + (u.roles.indexOf('admin') !== -1 ? ' danger' : '') + '" data-idx="' + idx + '" data-role="admin">' + (u.roles.indexOf('admin') !== -1 ? 'Quitar admin' : 'Hacer admin') + '</button>' +
                '<button class="cms-admin-rolebtn' + (u.roles.indexOf('editor') !== -1 ? ' danger' : '') + '" data-idx="' + idx + '" data-role="editor">' + (u.roles.indexOf('editor') !== -1 ? 'Quitar editor' : 'Hacer editor') + '</button>' +
                '</td>' +
                '</tr>';
            });
            html += '</tbody></table><p class="cms-admin-status" id="cms-users-status"></p>' +
              '<p class="cms-admin-muted">Tras cambiar un rol, el usuario debe cerrar sesión y volver a entrar.</p>';
            body.innerHTML = html;

            var statusEl = body.querySelector('#cms-users-status');
            var buttons = body.querySelectorAll('.cms-admin-rolebtn');
            for (var i = 0; i < buttons.length; i++) {
              (function (btn) {
                btn.addEventListener('click', function () {
                  var u = users[parseInt(btn.getAttribute('data-idx'), 10)];
                  var role = btn.getAttribute('data-role');
                  var hasRole = u.roles.indexOf(role) !== -1;
                  var newRoles = hasRole
                    ? u.roles.filter(function (roleName) { return roleName !== role; })
                    : u.roles.concat([role]);

                  statusEl.textContent = 'Actualizando ' + u.email + '...';
                  statusEl.className = 'cms-admin-status';

                  fetch('/.netlify/functions/manage-users', {
                    method: 'POST',
                    headers: {
                      'Content-Type': 'application/json',
                      'Authorization': 'Bearer ' + getToken(),
                    },
                    body: JSON.stringify({ userId: u.id, roles: newRoles }),
                  })
                    .then(function (res) { return res.json().then(function (data) { return { ok: res.ok, data: data }; }); })
                    .then(function (r2) {
                      if (r2.ok) {
                        statusEl.textContent = 'Roles actualizados.';
                        statusEl.className = 'cms-admin-status ok';
                        renderUsuarios(body);
                      } else {
                        statusEl.textContent = r2.data.error || 'Error al actualizar.';
                        statusEl.className = 'cms-admin-status err';
                      }
                    })
                    .catch(function (err) {
                      statusEl.textContent = 'Error de red: ' + err.message;
                      statusEl.className = 'cms-admin-status err';
                    });
                });
              })(buttons[i]);
            }
          })
          .catch(function (err) {
            body.innerHTML = '<h3>Usuarios registrados</h3><p class="cms-admin-status err">Error de red: ' + escapeHtml(err.message) + '</p>';
          });
      }

      /* --- Tab: Revisiones --- */
      function renderRevisiones(body) {
        // Detectar la entrada actual desde la URL del CMS
        var hash = window.location.hash || '';
        var m = hash.match(/#\/collections\/([^/]+)\/(?:entries\/([^/?]+)|new)/);
        var collection = m ? m[1] : null;
        var slug = m ? m[2] : null;

        if (!collection || !slug) {
          body.innerHTML =
            '<h3>Historial de revisiones</h3>' +
            '<p class="cms-admin-muted">Abre una entrada o memoria para ver su historial de cambios.</p>' +
            '<p class="cms-admin-muted" style="margin-top:0.5rem;">Selecciona una entrada desde la lista de colecciones y vuelve a abrir esta pestaña.</p>';
          return;
        }

        var baseCollection = collection.replace(/^borradores-/, '');
        var filePath = 'src/content/' + baseCollection + '/' + slug + '.md';

        body.innerHTML =
          '<h3>Historial de revisiones</h3>' +
          '<p class="cms-admin-muted" style="margin-bottom:1rem;">Archivo: <code style="background:#f3f4f6;padding:0.15rem 0.4rem;border-radius:0.25rem;font-size:0.8rem;">' + escapeHtml(filePath) + '</code></p>' +
          '<p class="cms-admin-muted">Cargando historial...</p>';

        var token = getToken();
        if (!token) {
          body.innerHTML = '<h3>Historial de revisiones</h3><p class="cms-admin-status err">No hay sesión activa.</p>';
          return;
        }

        fetch('/.netlify/functions/get-revision-history?path=' + encodeURIComponent(filePath), {
          headers: { 'Authorization': 'Bearer ' + token },
        })
          .then(function (res) { return res.json().then(function (data) { return { ok: res.ok, data: data }; }); })
          .then(function (r) {
            if (!r.ok) {
              body.innerHTML = '<h3>Historial de revisiones</h3><p class="cms-admin-status err">' + escapeHtml(r.data.error || 'Error al cargar el historial.') + '</p>';
              return;
            }
            var revisions = r.data.revisions || [];
            if (revisions.length === 0) {
              body.innerHTML = '<h3>Historial de revisiones</h3><p class="cms-admin-muted">No se encontraron revisiones para este archivo.</p>';
              return;
            }

            var html = '<h3>Historial de revisiones</h3>' +
              '<p class="cms-admin-muted" style="margin-bottom:1rem;">Archivo: <code style="background:#f3f4f6;padding:0.15rem 0.4rem;border-radius:0.25rem;font-size:0.8rem;">' + escapeHtml(filePath) + '</code></p>' +
              '<div style="border:1px solid #e5e7eb;border-radius:0.5rem;overflow:hidden;">';

            revisions.forEach(function (rev, idx) {
              var date = new Date(rev.date);
              var dateStr = date.toLocaleDateString('es-ES', { day: '2-digit', month: 'short', year: 'numeric', hour: '2-digit', minute: '2-digit' });
              var isLatest = idx === 0;
              html +=
                '<div style="padding:0.75rem 1rem;border-bottom:1px solid #f3f4f6;' + (isLatest ? 'background:#f0fdf4;' : '') + '">' +
                '  <div style="display:flex;align-items:center;gap:0.5rem;margin-bottom:0.25rem;">' +
                (isLatest ? '<span style="background:#22c55e;color:#fff;font-size:0.65rem;font-weight:700;padding:0.1rem 0.4rem;border-radius:999px;">ACTUAL</span>' : '') +
                '    <a href="' + escapeHtml(rev.url) + '" target="_blank" rel="noopener" style="font-size:0.82rem;font-weight:600;color:#2563eb;text-decoration:none;">' +
                '      Ver en GitHub →' +
                '    </a>' +
                '  </div>' +
                '  <p style="margin:0.25rem 0 0;font-size:0.82rem;color:#374151;">' + escapeHtml(rev.message.split('\n')[0]) + '</p>' +
                '  <p style="margin:0.25rem 0 0;font-size:0.72rem;color:#9ca3af;">' + escapeHtml(rev.author) + ' · ' + dateStr + '</p>' +
                '</div>';
            });

            html += '</div>';
            body.innerHTML = html;
          })
          .catch(function (err) {
            body.innerHTML = '<h3>Historial de revisiones</h3><p class="cms-admin-status err">Error de red: ' + escapeHtml(err.message) + '</p>';
          });
      }

      function injectSidebarActions() {

          return false;

        var container = document.createElement('div');
        container.className = 'cms-sidebar-actions';
        container.innerHTML = createActionsHtml();
        bindActionClicks(container);
        sidebar.appendChild(container);

      }

      function injectFloatingActions() {
        if (document.querySelector('.cms-floating-actions')) return;
        var container = document.createElement('div');
        container.className = 'cms-floating-actions';
        container.innerHTML = createActionsHtml();
        bindActionClicks(container);
