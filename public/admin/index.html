<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Gestor de Contenido - Simposio</title>
</head>
<body>
  <script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>
  <script src="https://unpkg.com/decap-cms@^3.0.0/dist/decap-cms.js"></script>
  <style>
    .cms-user-name {
      margin-right: 0.5rem;
      color: #1f2937;
      font-size: 0.875rem;
      font-weight: 500;
      white-space: nowrap;
      max-width: 160px;
      overflow: hidden;
      text-overflow: ellipsis;
      display: inline-flex;
      align-items: center;
      line-height: 1;
    }
    @media (max-width: 640px) {
      .cms-user-name {
        max-width: 100px;
      }
    }
  </style>
  <script>
    (function () {
      var DEBUG = true;
      function log() {
        if (DEBUG) console.log.apply(console, ['[CMS User Name]'].concat(Array.prototype.slice.call(arguments)));
      }

      function waitForIdentity(callback) {
        if (window.netlifyIdentity) {
          callback(window.netlifyIdentity);
          return;
        }
        var attempts = 0;
        var maxAttempts = 60;
        var interval = setInterval(function () {
          attempts++;
          if (window.netlifyIdentity) {
            clearInterval(interval);
            log('netlifyIdentity encontrado después de ' + attempts + ' intentos');
            callback(window.netlifyIdentity);
          } else if (attempts >= maxAttempts) {
            clearInterval(interval);
            log('netlifyIdentity no se encontró tras esperar');
          }
        }, 100);
      }

      function getUserName(user) {
        if (!user) return null;
        var metadata = user.user_metadata || user.app_metadata || {};
        return metadata.full_name || metadata.name || user.email || 'Usuario';
      }

      function findAvatarButton() {
        // Selectores ordenados de más específico a más genérico.
        var selectors = [
          '[data-testid="user-menu"]',
          '[data-testid="avatar-menu"]',
          '[data-testid="user-button"]',
          '[aria-label*="user" i]',
          '[aria-label*="usuario" i]',
          '[aria-label*="account" i]',
          '[aria-label*="perfil" i]',
          'header button img[src*="gravatar"]',
          'header button img[src^="data:"]',
          'nav button img[src*="gravatar"]',
          'nav button img[src^="data:"]',
          'header button img[alt*="avatar" i]',
          'nav button img[alt*="avatar" i]',
          'header button svg + img',
          'nav button svg + img',
        ];
        for (var i = 0; i < selectors.length; i++) {
          var target = document.querySelector(selectors[i]);
          if (target) {
            var button = target.closest('button');
            if (button) {
              log('avatar encontrado con selector:', selectors[i]);
              return { button: button, img: target.tagName === 'IMG' ? target : target.querySelector('img') };
            }
          }
        }

        // Fallback: último botón dentro del header o nav visible.
        var header = document.querySelector('header, nav, [class*="header" i], [class*="topbar" i]');
        if (header) {
          var buttons = header.querySelectorAll('button');
          if (buttons.length) {
            var lastButton = buttons[buttons.length - 1];
            log('usando último botón del header como fallback');
            return { button: lastButton, img: lastButton.querySelector('img') };
          }
        }

        log('no se encontró botón de avatar');
        return null;
      }

      function injectUserName(user) {
        var name = getUserName(user);
        if (!name) {
          log('no hay nombre para mostrar');
          return false;
        }
        log('intentando inyectar nombre:', name);

        var found = findAvatarButton();
        if (!found) return false;

        var button = found.button;
        if (button.querySelector('.cms-user-name')) {
          log('nombre ya inyectado');
          return true;
        }

        // Asegurar que el botón disponga sus hijos en horizontal.
        button.style.display = 'inline-flex';
        button.style.alignItems = 'center';

        var span = document.createElement('span');
        span.className = 'cms-user-name';
        span.textContent = name;
        span.title = name;

        if (found.img && found.img.nextSibling) {
          button.insertBefore(span, found.img.nextSibling);
        } else if (found.img) {
          button.appendChild(span);
        } else {
          button.insertBefore(span, button.firstChild);
        }
        log('nombre inyectado con éxito');
        return true;
      }

      function watchAndInject(user) {
        if (injectUserName(user)) return;
        var attempts = 0;
        var observer = new MutationObserver(function () {
          attempts++;
          if (injectUserName(user)) {
            observer.disconnect();
            log('inyectado tras observar ' + attempts + ' mutaciones');
          } else if (attempts > 200) {
            observer.disconnect();
            log('se detuvo el observador sin encontrar el avatar');
          }
        });
        observer.observe(document.body, { childList: true, subtree: true });
      }

      waitForIdentity(function (identity) {
        log('configurando identity events');

        function onUserReady(user) {
          if (user) {
            log('usuario listo:', user.email);
            watchAndInject(user);
          }
        }

        identity.on('init', onUserReady);
        identity.on('login', onUserReady);
        identity.on('logout', function () {
          log('logout');
          var existing = document.querySelector('.cms-user-name');
          if (existing) existing.remove();
        });

        onUserReady(identity.currentUser());
      });
    })();
  </script>
</body>
</html>
