name: Staging authenticated E2E

on:
  push:
    branches: [staging]
  workflow_dispatch:

concurrency:
  group: staging-authenticated-e2e
  cancel-in-progress: false

jobs:
  authenticated-workflow:
    if: vars.STAGING_E2E_ENABLED == 'true'
    name: staging-e2e
    runs-on: ubuntu-latest
    environment: staging
    timeout-minutes: 25
    steps:
      - name: Checkout staging
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.0.0
        with:
          ref: staging

      - name: Setup Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: '22.12.0'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run authenticated lifecycle
        env:
          E2E_RUN_AUTHENTICATED: '1'
          E2E_BASE_URL: ${{ vars.STAGING_URL }}
          E2E_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          E2E_SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          E2E_ADMIN_EMAIL: ${{ secrets.E2E_ADMIN_EMAIL }}
          E2E_ADMIN_PASSWORD: ${{ secrets.E2E_ADMIN_PASSWORD }}
        run: npx playwright test e2e/authenticated-workflow.spec.ts
