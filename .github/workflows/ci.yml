name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.0.0
        with:
          fetch-depth: 0

      - name: Classify changes
        id: changes
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if git cat-file -e "${BASE_SHA}^{commit}" 2>/dev/null; then
            changed="$(git diff --name-only "$BASE_SHA" "$GITHUB_SHA")"
            if [ -n "$changed" ] && ! printf '%s\n' "$changed" | grep -qvE '^(src/content/|public/images/)'; then
              echo "content_only=true" >> "$GITHUB_OUTPUT"
            else
              echo "content_only=false" >> "$GITHUB_OUTPUT"
            fi
          else
            echo "content_only=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: '22.12.0'
          cache: npm

      - name: Install dependencies
        if: steps.changes.outputs.content_only != 'true'
        run: npm ci

      - name: Dependency audit
        if: steps.changes.outputs.content_only != 'true'
        run: npm audit --omit=dev --audit-level=high

      - name: Secret scan
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2.3.9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Lint
        if: steps.changes.outputs.content_only != 'true'
        run: npm run lint

      - name: Format
        if: steps.changes.outputs.content_only != 'true'
        run: npm run format:check

      - name: Taxonomías y tipos
        if: steps.changes.outputs.content_only != 'true'
        run: npm run check

      - name: Validación editorial rápida
        if: steps.changes.outputs.content_only == 'true'
        run: npm run check:editorial

      - name: Tests
        if: steps.changes.outputs.content_only != 'true'
        run: npm test

      - name: API contract tests
        if: steps.changes.outputs.content_only != 'true'
        run: npm exec --yes --package=netlify-cli@27.1.1 -- npm run test:api

      - name: Build
        if: steps.changes.outputs.content_only != 'true'
        run: npm run build

      - name: Install Playwright Chromium
        if: steps.changes.outputs.content_only != 'true'
        timeout-minutes: 10
        run: npx playwright install --with-deps chromium

      - name: Smoke y accesibilidad E2E
        if: steps.changes.outputs.content_only != 'true'
        timeout-minutes: 10
        run: npx playwright test

      - name: Build must not mutate sources
        run: git diff --exit-code
