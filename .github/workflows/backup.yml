name: Encrypted production backup

on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

concurrency:
  group: production-backup
  cancel-in-progress: false

jobs:
  backup:
    runs-on: ubuntu-latest
    environment: production-backup
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.0.0

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: '22.12.0'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install pinned Supabase CLI
        uses: supabase/setup-cli@ab058987d8d6c725971f6cf9d0b5c98467e30bd1 # v1 branch, pinned 2026-08-16
        with:
          version: 2.113.0

      - name: Export database and media
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          BACKUP_ENCRYPTION_KEY: ${{ secrets.BACKUP_ENCRYPTION_KEY }}
          S3_ENDPOINT: ${{ secrets.S3_ENDPOINT }}
          S3_REGION: ${{ secrets.S3_REGION }}
          S3_BUCKET: ${{ secrets.S3_BUCKET }}
          S3_ACCESS_KEY_ID: ${{ secrets.S3_ACCESS_KEY_ID }}
          S3_SECRET_ACCESS_KEY: ${{ secrets.S3_SECRET_ACCESS_KEY }}
          S3_FORCE_PATH_STYLE: ${{ secrets.S3_FORCE_PATH_STYLE }}
          S3_PUBLIC_BASE_URL: ${{ secrets.S3_PUBLIC_BASE_URL }}
          S3_BACKUP_BUCKET: ${{ secrets.S3_BACKUP_BUCKET }}
        run: |
          set -euo pipefail
          required_secrets=(
            SUPABASE_ACCESS_TOKEN SUPABASE_DB_PASSWORD SUPABASE_PROJECT_ID
            SUPABASE_URL SUPABASE_SERVICE_ROLE_KEY BACKUP_ENCRYPTION_KEY
            S3_ENDPOINT S3_REGION S3_BUCKET S3_ACCESS_KEY_ID S3_SECRET_ACCESS_KEY
            S3_FORCE_PATH_STYLE S3_BACKUP_BUCKET
          )
          missing=0
          for name in "${required_secrets[@]}"; do
            if [ -z "${!name:-}" ]; then
              echo "::error::Falta el secreto ${name} en el entorno production-backup."
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            exit 1
          fi
          backup_dir="$(mktemp -d)"
          trap 'rm -rf "$backup_dir"' EXIT
          export BACKUP_OUTPUT_DIR="$backup_dir/export"
          mkdir -p "$BACKUP_OUTPUT_DIR"
          mkdir -p "$BACKUP_OUTPUT_DIR/database"
          supabase link --project-ref "$SUPABASE_PROJECT_ID" --password "$SUPABASE_DB_PASSWORD"
          supabase db dump --linked --file "$BACKUP_OUTPUT_DIR/database/schema.sql"
          supabase db dump --linked --data-only --use-copy --file "$BACKUP_OUTPUT_DIR/database/data.sql"
          node --experimental-strip-types scripts/backup-supabase-media.mjs
          node scripts/backup-garage-media.mjs
          cp -R src/content "$BACKUP_OUTPUT_DIR/published-content"
          tar -C "$BACKUP_OUTPUT_DIR" -czf "$backup_dir/backup.tar.gz" .
          openssl enc -aes-256-cbc -pbkdf2 -salt \
            -in "$backup_dir/backup.tar.gz" \
            -out "$backup_dir/production-backup-${GITHUB_RUN_ID}.tar.gz.enc" \
            -pass env:BACKUP_ENCRYPTION_KEY
          test -s "$backup_dir/production-backup-${GITHUB_RUN_ID}.tar.gz.enc"
          openssl enc -d -aes-256-cbc -pbkdf2 \
            -in "$backup_dir/production-backup-${GITHUB_RUN_ID}.tar.gz.enc" \
            -out "$backup_dir/verify.tar.gz" \
            -pass env:BACKUP_ENCRYPTION_KEY
          tar -tzf "$backup_dir/verify.tar.gz" >/dev/null
          node scripts/upload-backup-to-garage.mjs "$backup_dir/production-backup-${GITHUB_RUN_ID}.tar.gz.enc"
