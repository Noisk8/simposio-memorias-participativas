[build]
  command = "npm run build"
  publish = "dist"
  ignore = "node scripts/netlify-ignore-build.mjs"

[build.environment]
  NODE_VERSION = "22.12.0"

[functions]
  directory = "netlify/functions"

# Los headers de seguridad viven en public/_headers (fuente única).

[dev]
  command = "astro dev"
  targetPort = 4321
  port = 8888
