[build]
  command = "npm run build"
  publish = "dist"
  ignore = "node scripts/netlify-ignore-build.mjs"

[build.environment]
  NODE_VERSION = "22.12.0"

[functions]
  directory = "netlify/functions"

[functions."cms-operations"]
  schedule = "*/10 * * * *"

# 00:05 America/Bogota (UTC-5): activa contenido cuya publish_date ya venció.
[functions."scheduled-publish"]
  schedule = "5 5 * * *"

# Sharp solo se empaqueta en el endpoint de transformación; listar y editar medios sigue ligero.
[functions."upload-media"]
  external_node_modules = ["sharp"]

[context.staging]
  command = "npm run build"

[context.staging.environment]
  GITHUB_BRANCH = "staging"
  NETLIFY_DEPLOY_CONTEXT = "branch-deploy"
  SITE_URL = "https://staging--simposio-memorias-participativas.netlify.app"

# Los headers de seguridad viven en public/_headers (fuente única).

[dev]
  # Astro permanece en segundo plano; seguir sus logs mantiene el comando de
  # framework activo para que Netlify Dev no cierre el proxy y las Functions.
  command = "astro dev --background --port 4322 && astro dev logs --follow"
  targetPort = 4322
  port = 8888
